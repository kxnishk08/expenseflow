spring:
  application:
    name: expenseflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expenseflow}
    username: ${DB_USER:expenseflow}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: "SET lock_timeout = '3s'; SET statement_timeout = '10s'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: EXPENSEFLOWSESSION
        http-only: true
        secure: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
---
spring:
  config:
    activate:
      on-profile: dev
server:
  servlet:
    session:
      cookie:
        secure: false
